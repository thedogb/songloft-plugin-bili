name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Check whitespace
        run: git diff --check

      - name: Build
        run: npm run build

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/bili.jsplugin.zip
          unzip -t dist/bili.jsplugin.zip

          sha256sum dist/bili.jsplugin.zip | tee dist/SHA256SUMS
          # upload-artifact strips the shared dist/ prefix, so make the checksum path portable.
          sed -i 's#  dist/bili.jsplugin.zip#  bili.jsplugin.zip#' dist/SHA256SUMS

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: bili-jsplugin-${{ github.sha }}
          path: |
            dist/bili.jsplugin.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
